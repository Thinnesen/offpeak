# Sample egress policy for the controller. It allows only:
# - DNS to kube-dns in kube-system.
# - HTTPS (TCP 443) and TCP 6443 to any address: the Kubernetes API server and the
#   provider endpoints (api.energidataservice.dk, web-api.tp.entsoe.eu,
#   api.electricitymaps.com, ec2.<region>.amazonaws.com, and the AWS credential endpoints).
# A NetworkPolicy cannot select host names. For a stricter policy, use the FQDN rules of
# your network plugin (for example CiliumNetworkPolicy toFQDNs), or a ipBlock for the API server.
# EKS Pod Identity uses the link-local address 169.254.170.23 on TCP 80. Add it if you use Pod Identity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: offpeak
    app.kubernetes.io/managed-by: kustomize
  name: allow-egress
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: offpeak
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
