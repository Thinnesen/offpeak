# Binds the namespaced Role "manager-role" (Secret "get" in the controller namespace only).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: offpeak
    app.kubernetes.io/managed-by: kustomize
  name: manager-secrets-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
