---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - karpenter.sh
  resources:
  - nodepools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - offpeak.thinnesen.com
  resources:
  - deferrablejobs
  - signalsources
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - offpeak.thinnesen.com
  resources:
  - deferrablejobs/finalizers
  verbs:
  - update
- apiGroups:
  - offpeak.thinnesen.com
  resources:
  - deferrablejobs/status
  - signalsources/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
