# This rule is not used by the project offpeak itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over offpeak.thinnesen.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: offpeak
    app.kubernetes.io/managed-by: kustomize
  name: signalsource-admin-role
rules:
- apiGroups:
  - offpeak.thinnesen.com
  resources:
  - signalsources
  verbs:
  - '*'
- apiGroups:
  - offpeak.thinnesen.com
  resources:
  - signalsources/status
  verbs:
  - get
