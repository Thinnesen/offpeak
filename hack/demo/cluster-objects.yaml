apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: demo
spec:
  template:
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
---
apiVersion: offpeak.thinnesen.com/v1alpha1
kind: SignalSource
metadata:
  name: dk1-carbon
spec:
  energiDataService:
    area: DK1
    series: CO2Prognosis
---
apiVersion: offpeak.thinnesen.com/v1alpha1
kind: SignalSource
metadata:
  name: eu-north-1-weather
spec:
  weatherProxy:
    cloudRegion: aws:eu-north-1
---
apiVersion: offpeak.thinnesen.com/v1alpha1
kind: SignalSource
metadata:
  name: us-west-2-weather
spec:
  weatherProxy:
    cloudRegion: aws:us-west-2
