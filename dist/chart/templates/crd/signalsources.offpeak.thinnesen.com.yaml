{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.23.0
  name: signalsources.offpeak.thinnesen.com
spec:
  group: offpeak.thinnesen.com
  names:
    kind: SignalSource
    listKind: SignalSourceList
    plural: signalsources
    singular: signalsource
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.unit
      name: Unit
      type: string
    - jsonPath: .status.lastFetchTime
      name: Last fetch
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SignalSource is a cluster-wide source of a signal time series,
          for example a price or a carbon intensity.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the provider of the signal.
            properties:
              awsSpot:
                description: awsSpot reads the EC2 spot price history.
                properties:
                  productDescription:
                    default: Linux/UNIX
                    description: productDescription filters the spot price history.
                    enum:
                    - Linux/UNIX
                    - Linux/UNIX (Amazon VPC)
                    - Windows
                    - Windows (Amazon VPC)
                    - Red Hat Enterprise Linux
                    - SUSE Linux
                    type: string
                  region:
                    description: region is the AWS region, for example eu-north-1.
                    maxLength: 32
                    pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]+$
                    type: string
                required:
                - region
                type: object
              electricityMaps:
                description: electricityMaps reads the carbon intensity forecast of
                  Electricity Maps.
                properties:
                  tokenSecretRef:
                    description: tokenSecretRef selects the API token. The Secret
                      must be in the controller namespace.
                    properties:
                      key:
                        description: key is the key in the Secret data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the name of the Secret.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  zone:
                    description: zone is the Electricity Maps zone, for example SE-SE3.
                    maxLength: 32
                    pattern: ^[A-Z]{2}(-[A-Z0-9]+)*$
                    type: string
                required:
                - tokenSecretRef
                - zone
                type: object
              energiDataService:
                description: energiDataService reads Danish day-ahead prices or CO2
                  prognoses. It needs no key.
                properties:
                  area:
                    description: area is the Danish price area.
                    enum:
                    - DK1
                    - DK2
                    type: string
                  series:
                    description: series is the data set to read.
                    enum:
                    - DayAheadPrice
                    - CO2Prognosis
                    type: string
                required:
                - area
                - series
                type: object
              energyCharts:
                description: energyCharts reads the forecast of the non-renewable
                  share for a European country. It needs no key.
                properties:
                  country:
                    description: country is a lower-case country code with Energy-Charts
                      data.
                    enum:
                    - at
                    - be
                    - ch
                    - cz
                    - de
                    - dk
                    - es
                    - fi
                    - fr
                    - it
                    - lu
                    - nl
                    - "no"
                    - pl
                    - pt
                    - se
                    type: string
                required:
                - country
                type: object
              entsoe:
                description: entsoe reads day-ahead prices from the ENTSO-E Transparency
                  Platform.
                properties:
                  biddingZone:
                    description: biddingZone is the EIC code of the bidding zone,
                      for example 10Y1001A1001A82H.
                    pattern: ^[0-9]{2}[A-Z][0-9A-Z-]{12}[0-9A-Z]$
                    type: string
                  tokenSecretRef:
                    description: tokenSecretRef selects the API token. The Secret
                      must be in the controller namespace.
                    properties:
                      key:
                        description: key is the key in the Secret data.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: name is the name of the Secret.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - biddingZone
                - tokenSecretRef
                type: object
              ukCarbonIntensity:
                description: ukCarbonIntensity reads the 48-hour carbon forecast for
                  Great Britain. It needs no key.
                properties:
                  regionID:
                    description: regionID is 0 (the default) for Great Britain, or
                      a regional id from 1 to 17, for example 13 for London.
                    format: int32
                    maximum: 17
                    minimum: 0
                    type: integer
                type: object
              weatherProxy:
                description: weatherProxy estimates clean power from the Open-Meteo
                  sun and wind forecast. It is a proxy. It needs no key.
                properties:
                  cloudRegion:
                    description: cloudRegion is a cloud region, for example aws:eu-north-1,
                      azure:westeurope or gcp:us-central1.
                    maxLength: 64
                    pattern: ^(aws|azure|gcp):[a-z0-9-]+$
                    type: string
                  latitude:
                    description: latitude in decimal degrees, for example "59.33".
                    pattern: ^-?[0-9]{1,2}(\.[0-9]{1,6})?$
                    type: string
                  longitude:
                    description: longitude in decimal degrees, for example "18.07".
                    pattern: ^-?[0-9]{1,3}(\.[0-9]{1,6})?$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set cloudRegion, or latitude and longitude
                  rule: has(self.cloudRegion) != (has(self.latitude) && has(self.longitude))
                - message: set latitude and longitude together
                  rule: has(self.latitude) == has(self.longitude)
            type: object
            x-kubernetes-validations:
            - message: exactly one provider must be set
              rule: '[has(self.energiDataService), has(self.entsoe), has(self.awsSpot),
                has(self.electricityMaps), has(self.weatherProxy), has(self.ukCarbonIntensity),
                has(self.energyCharts)].filter(x, x).size() == 1'
          status:
            description: status defines the observed state of SignalSource
            properties:
              conditions:
                description: conditions hold the Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastFetchTime:
                description: lastFetchTime is the time of the last successful fetch.
                format: date-time
                type: string
              unit:
                description: unit is the unit of the signal values, for example EUR/MWh.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
