name: Helm Chart

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test-chart:
    permissions:
      contents: read
    name: Install the chart on Kind
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the chart CRDs and lint the chart
        run: make check-chart

      # The Makefile installs pinned versions of kind, kubectl and helm and checks them.
      - name: Install the chart and check the controller
        run: make test-chart
