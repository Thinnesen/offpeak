name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    name: Image, chart and release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set the version and the names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          {
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "IMAGE=ghcr.io/${owner}/offpeak"
            echo "CHART_REPO=ghcr.io/${owner}/charts"
          } >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image (amd64, arm64)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Write the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: offpeak-${{ env.VERSION }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Package, push and sign the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          make install-helm
          echo "$GITHUB_TOKEN" | bin/helm registry login ghcr.io --username "$ACTOR" --password-stdin
          bin/helm package dist/chart --version "$VERSION" --app-version "$VERSION"
          bin/helm push "offpeak-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee helm-push.log
          digest="$(sed -n 's/^Digest: //p' helm-push.log)"
          cosign sign --yes "${CHART_REPO}/offpeak@${digest}"
          echo "CHART_DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: Write install.yaml
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          make build-installer IMG="${IMAGE}:${VERSION}@${DIGEST}"
          cp dist/install.yaml "offpeak-${VERSION}-install.yaml"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          \`\`\`sh
          helm install offpeak oci://${CHART_REPO}/offpeak --version ${VERSION} \\
            --namespace offpeak-system --create-namespace
          \`\`\`

          Or: \`kubectl apply --server-side -f offpeak-${VERSION}-install.yaml\`

          ## Artifacts

          - Image: \`${IMAGE}:${VERSION}@${DIGEST}\` (linux/amd64, linux/arm64)
          - Chart: \`oci://${CHART_REPO}/offpeak:${VERSION}@${CHART_DIGEST}\`
          - SBOM (SPDX): \`offpeak-${VERSION}.sbom.spdx.json\`

          ## Verify

          \`\`\`sh
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/v" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          ## Experimental providers

          \`entsoe\`, \`electricityMaps\` and \`awsSpot\` are tested with fixtures from the documented formats only.
          Please report problems with the live APIs.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$REPO" --verify-tag --title "offpeak ${VERSION}" \
            --notes-file notes.md \
            "offpeak-${VERSION}-install.yaml" "offpeak-${VERSION}.sbom.spdx.json"
